name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job widens this.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-latest ships full Xcode, which the universal build needs: --arch x2 goes
    # through xcbuild, which Command Line Tools alone does not provide.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: swift --version

      - name: Build universal
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Locate and verify the binary
        id: bin
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/wallspan"
          test -x "$BIN"
          # A missing arch would otherwise ship silently as a single-arch build.
          ARCHS="$(lipo -archs "$BIN")"
          echo "archs: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in *" $want "*) ;; *) echo "::error::$want missing from $ARCHS"; exit 1;; esac
          done
          echo "path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          set -euo pipefail
          BIN='${{ steps.bin.outputs.path }}'
          # These assert "does not crash" - they exercise layout construction, config
          # loading and JSON decode. Asserting on display counts here would be testing
          # the runner's hardware, not wallspan.
          "$BIN" help > /dev/null
          "$BIN" config show
          # `info` is the one that needs a display, and what a runner provides varies: no
          # screens at all gives "no displays found", while a virtual display with no
          # stable UUID gives "could not resolve a stable UUID". Both are wallspan
          # reporting an environment it cannot serve, which is the correct answer here.
          #
          # So assert the property actually wanted - it does not crash - rather than one
          # message: exit 0, or exit 1 with a `fail()` line on stderr. A signal death
          # (128+n) or any other exit code still fails the step.
          if out="$("$BIN" info 2>&1)"; then
            printf '%s\n' "$out"
          else
            status=$?
            printf '%s\n' "$out"
            test "$status" -eq 1
            grep -q '^error: ' <<<"$out"
          fi

      - name: Check the --json contract
        # The contract is what the menu bar app parses, and the app is released on its own
        # schedule - so a field quietly dropped here is only found by a user whose app
        # stops working. Shape is asserted, not values: a runner has no display.
        run: Scripts/check-json-contract.sh '${{ steps.bin.outputs.path }}'

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          NAME="wallspan-${VERSION}-universal"
          mkdir -p "dist/$NAME"
          cp '${{ steps.bin.outputs.path }}' "dist/$NAME/wallspan"
          cp README.md LICENSE "dist/$NAME/"
          # tar, not a bare binary: GitHub's artifact upload does not preserve the
          # executable bit, so a raw upload arrives chmod 644 and will not run.
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.tarball }}
          if-no-files-found: error

  release:
    # Tags only. Everything else stops at the workflow artifact above.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Draft release
        # Pinned to a commit, not a floating tag: this action holds contents:write, and a
        # moving tag is precisely how that gets turned against you.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/**/*.tar.gz
          body: |
            Universal binary (arm64 + x86_64), macOS 14+.

            ```sh
            tar -xzf wallspan-*-universal.tar.gz
            cd wallspan-*-universal
            xattr -c wallspan   # unsigned: macOS quarantines downloads
            ./wallspan info
            ```

            Not signed or notarised, so Gatekeeper blocks it until the `xattr` line above.
