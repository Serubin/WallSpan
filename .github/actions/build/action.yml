name: Build and package
description: >
  Stamps the version, runs the unit tests, builds the universal Wallspan.app (ad-hoc,
  hardened runtime), verifies it and the CLI inside it, and packages the assets from it.
  Shared by CI and the release workflow so the artifacts a release ships are produced by
  exactly the steps that gated every PR; release.yml then re-signs them with a Developer ID.

inputs:
  channel:
    description: release | beta | unsigned | snapshot | dev
    required: true
  version:
    description: Explicit version, for the release, beta and unsigned channels. Derived otherwise.
    required: false
    default: ""
  pr-number:
    description: PR number, required for the dev channel.
    required: false
    default: ""
  sha:
    description: Commit to version against. Defaults to HEAD of the checkout.
    required: false
    default: HEAD

outputs:
  version:
    description: The full version string this build reports.
    value: ${{ steps.version.outputs.version }}
  slug:
    description: The version, safe for filenames.
    value: ${{ steps.version.outputs.slug }}
  tarball:
    description: Path to the CLI tarball.
    value: ${{ steps.package.outputs.tarball }}
  binary:
    description: Path to the bare CLI binary, copied from the bundle.
    value: ${{ steps.package.outputs.binary }}
  app-zip:
    description: Path to the Wallspan.app zip.
    value: ${{ steps.package.outputs.app-zip }}
  checksums:
    description: Path to SHA256SUMS.txt.
    value: ${{ steps.package.outputs.checksums }}

runs:
  using: composite
  steps:
    - name: Show toolchain
      shell: bash
      run: swift --version

    - name: Stamp the version
      id: version
      shell: bash
      # Through env, not interpolated: `version` reaches here from a workflow_dispatch input,
      # and an expression pasted into bash is a quote away from being a command.
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
        PR: ${{ inputs.pr-number }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        ARGS=(--channel "$CHANNEL" --sha "$SHA" --stamp)
        if [ -n "$VERSION" ]; then ARGS+=(--version "$VERSION"); fi
        if [ -n "$PR" ]; then ARGS+=(--pr "$PR"); fi
        Scripts/version.sh "${ARGS[@]}" | tee -a "$GITHUB_OUTPUT"

    - name: Unit tests
      shell: bash
      # Debug and host-arch only: these cover the app's logic, not the universal link.
      run: swift test

    - name: Release script tests
      shell: bash
      run: Scripts/test-next-prerelease.sh

    - name: Build Wallspan.app
      id: app
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        BUNDLE_VERSION: ${{ steps.version.outputs.bundle_version }}
      run: |
        set -euo pipefail
        # --version, not the script's `git describe` fallback: stamping dirtied the tree,
        # so a describe would brand every CI build `-dirty`.
        Scripts/make-app.sh --universal \
          --version "$VERSION" --build-version "$BUNDLE_VERSION"
        APP=dist/Wallspan.app
        echo "path=$APP" >> "$GITHUB_OUTPUT"
        # Every later check runs this copy: it is the one each asset ships, hardened as a
        # release's will be.
        echo "cli=$APP/Contents/Helpers/wallspan" >> "$GITHUB_OUTPUT"

    - name: Verify the bundle
      shell: bash
      env:
        APP: ${{ steps.app.outputs.path }}
      run: |
        set -euo pipefail
        # The bundle is what users double-click, so a broken signature or a missing
        # helper has to fail here rather than on their machine.
        Scripts/check-signature.sh "$APP" "$APP/Contents/Helpers/wallspan"
        test -x "$APP/Contents/MacOS/Wallspan"
        test -x "$APP/Contents/Helpers/wallspan"
        # Catches the copy being reordered after codesign, which strips it from the seal.
        test -f "$APP/Contents/Resources/AppIcon.icns"
        # A missing arch would otherwise ship silently as a single-arch build.
        for exe in "$APP/Contents/MacOS/Wallspan" "$APP/Contents/Helpers/wallspan"; do
          ARCHS="$(lipo -archs "$exe")"
          echo "$exe: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in
              *" $want "*) ;;
              *) echo "::error::$want missing from $exe ($ARCHS)"; exit 1 ;;
            esac
          done
        done
        FLAGS="$(codesign -dv "$APP" 2>&1 \
          | sed -n 's/^CodeDirectory .*flags=0x[0-9a-f]*(\([^)]*\)).*/\1/p')"
        echo "Signing: \`$FLAGS\` (Developer ID and notarisation happen only in release.yml)" \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Self-test the signature checker
      # A checker that accepted anything would wave through a release without the runtime.
      shell: bash
      env:
        CLI: ${{ steps.app.outputs.cli }}
      run: |
        set -euo pipefail
        T="$(mktemp -d)"
        cp "$CLI" "$T/unsigned"
        codesign --remove-signature "$T/unsigned"
        cp "$CLI" "$T/no-runtime"
        codesign --force --sign - --timestamp=none "$T/no-runtime"

        expect_rejected() {
          local out
          if out="$(Scripts/check-signature.sh "$T/$1" 2>&1)"; then
            echo "::error::check-signature.sh accepted the $1 copy"
            exit 1
          fi
          if ! grep -q "FAIL .*$2" <<<"$out"; then
            printf '%s\n' "$out"
            echo "::error::check-signature.sh rejected the $1 copy, but not because it $2"
            exit 1
          fi
          echo "rejected $1: $2"
        }
        expect_rejected unsigned 'does not verify'
        expect_rejected no-runtime 'hardened runtime off'
        rm -rf "$T"

    - name: Verify the stamp took
      shell: bash
      env:
        BIN: ${{ steps.app.outputs.cli }}
        WANT: ${{ steps.version.outputs.version }}
        WANT_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        REPORT="$("$BIN" version --json)"
        GOT="$(python3 -c 'import sys,json;print(json.load(sys.stdin)["version"]["version"])' <<<"$REPORT")"
        # An artifact whose filename and self-report disagree is worse than either being
        # wrong, because only one of them is visible once it is installed.
        [ "$GOT" = "$WANT" ] || { echo "::error::binary reports $GOT, expected $WANT"; exit 1; }
        # The app's update checker reads the channel, so a beta stamped as release would
        # never be offered the next beta.
        CHANNEL="$(python3 -c 'import sys,json;print(json.load(sys.stdin)["version"]["channel"])' <<<"$REPORT")"
        [ "$CHANNEL" = "$WANT_CHANNEL" ] \
          || { echo "::error::binary reports channel $CHANNEL, expected $WANT_CHANNEL"; exit 1; }
        echo "$GOT ($CHANNEL)"

    - name: Smoke test
      shell: bash
      env:
        BIN: ${{ steps.app.outputs.cli }}
      run: |
        set -euo pipefail
        # These assert "does not crash" - they exercise layout construction, config
        # loading and JSON decode. Asserting on display counts here would be testing
        # the runner's hardware, not wallspan.
        "$BIN" help > /dev/null
        "$BIN" config show
        # `info` is the one that needs a display, and what a runner provides varies: no
        # screens at all gives "no displays found", while a virtual display with no
        # stable UUID gives "could not resolve a stable UUID". Both are wallspan
        # reporting an environment it cannot serve, which is the correct answer here.
        #
        # So assert the property actually wanted - it does not crash - rather than one
        # message: exit 0, or exit 1 with a `fail()` line on stderr. A signal death
        # (128+n) or any other exit code still fails the step.
        if out="$("$BIN" info 2>&1)"; then
          printf '%s\n' "$out"
        else
          status=$?
          printf '%s\n' "$out"
          test "$status" -eq 1
          grep -q '^error: ' <<<"$out"
        fi

    - name: Check the --json contract
      # The contract is what the menu bar app parses, and the app is released on its own
      # schedule - so a field quietly dropped here is only found by a user whose app
      # stops working. Shape is asserted, not values: a runner has no display.
      shell: bash
      env:
        BIN: ${{ steps.app.outputs.cli }}
      run: Scripts/check-json-contract.sh "$BIN"

    - name: Package
      id: package
      shell: bash
      env:
        SLUG: ${{ steps.version.outputs.slug }}
        APP: ${{ steps.app.outputs.path }}
      run: |
        set -euo pipefail
        Scripts/package.sh --slug "$SLUG" "$APP" | tee -a "$GITHUB_OUTPUT"
